<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" font-family="-apple-system, 'SF Pro', Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="aY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .ttl  { font-size: 22px; font-weight: 700; fill: #111827; }
      .sub  { font-size: 13px; fill: #6b7280; }
      .head { font-size: 14px; font-weight: 700; fill: #111827; }
      .headW{ font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .band { font-size: 11px; font-weight: 700; fill: #6b7280; letter-spacing: .3px; }
      .bt   { font-size: 12.5px; font-weight: 700; fill: #111827; }
      .bs   { font-size: 10.5px; fill: #6b7280; }
      .li   { font-size: 11px; fill: #374151; }
      .hubT { font-size: 16px; font-weight: 700; fill: #111827; }
      .lblG { font-size: 10.5px; font-weight: 600; fill: #4b5563; }
      .lblB { font-size: 10.5px; font-weight: 600; fill: #2563eb; }
      .lblY { font-size: 10.5px; font-weight: 600; fill: #b45309; }
      .src  { font-size: 11px; font-weight: 600; fill: #374151; }
      .srcs { font-size: 9.5px; fill: #6b7280; }
    </style>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="590" y="34" text-anchor="middle" class="ttl">Launchpad · System Architecture</text>
  <text x="590" y="55" text-anchor="middle" class="sub">AppState 중심 단방향 흐름 — 입력은 쓰고, 뷰는 관찰하고, 부작용은 LauncherActions으로</text>

  <!-- ============ INPUT SOURCES (top pills) ============ -->
  <g>
    <rect x="352" y="76" width="104" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB" filter="url(#shadow)"/>
    <text x="404" y="94" text-anchor="middle" class="src">🖱️ Trackpad</text>
    <text x="404" y="108" text-anchor="middle" class="srcs">pinch / swipe</text>

    <rect x="476" y="76" width="104" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB" filter="url(#shadow)"/>
    <text x="528" y="94" text-anchor="middle" class="src">🖱️ Mouse</text>
    <text x="528" y="108" text-anchor="middle" class="srcs">DnD · 클릭</text>

    <rect x="600" y="76" width="104" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB" filter="url(#shadow)"/>
    <text x="652" y="94" text-anchor="middle" class="src">⌨️ Keyboard</text>
    <text x="652" y="108" text-anchor="middle" class="srcs">F4 · 타이핑</text>

    <rect x="724" y="76" width="104" height="40" rx="20" fill="#FFFFFF" stroke="#D1D5DB" filter="url(#shadow)"/>
    <text x="776" y="94" text-anchor="middle" class="src">🔑 Hotkey</text>
    <text x="776" y="108" text-anchor="middle" class="srcs">단축키 · 핫코너</text>
  </g>
  <!-- sources → input layer -->
  <line x1="404" y1="116" x2="404" y2="140" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aG)"/>
  <line x1="528" y1="116" x2="528" y2="140" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aG)"/>
  <line x1="652" y1="116" x2="652" y2="140" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aG)"/>
  <line x1="776" y1="116" x2="776" y2="140" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aG)"/>

  <!-- ============ INPUT LAYER ============ -->
  <rect x="352" y="142" width="476" height="150" rx="10" fill="#F4F4F4" stroke="#E0E0E0"/>
  <rect x="352" y="142" width="476" height="36" rx="10" fill="#FFD54F"/>
  <rect x="352" y="166" width="476" height="12" fill="#FFD54F"/>
  <text x="590" y="165" text-anchor="middle" class="head">① 입력 — 원시 이벤트 → 의도  (LaunchApp/Input · LaunchCore)</text>

  <!-- monitors row -->
  <rect x="366" y="188" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E6E6E6" filter="url(#shadow)"/>
  <text x="436" y="206" text-anchor="middle" class="bt">TrackpadGestureMonitor</text>
  <text x="436" y="220" text-anchor="middle" class="bs">dlopen MultitouchSupport</text>
  <rect x="520" y="188" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E6E6E6" filter="url(#shadow)"/>
  <text x="590" y="206" text-anchor="middle" class="bt">LauncherMouseMonitor</text>
  <text x="590" y="220" text-anchor="middle" class="bs">NSEvent 전역/로컬</text>
  <rect x="674" y="188" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E6E6E6" filter="url(#shadow)"/>
  <text x="744" y="206" text-anchor="middle" class="bt">Keyboard · Hotkey</text>
  <text x="744" y="220" text-anchor="middle" class="bs">Carbon · F4</text>
  <!-- ↓ -->
  <line x1="590" y1="230" x2="590" y2="244" stroke="#6b7280" stroke-width="1.5" marker-end="url(#aG)"/>
  <!-- gates row -->
  <rect x="366" y="246" width="140" height="40" rx="6" fill="#FFFDE7" stroke="#FDE68A" filter="url(#shadow)"/>
  <text x="436" y="264" text-anchor="middle" class="bt">TrackpadContactGate</text>
  <text x="436" y="278" text-anchor="middle" class="bs">5단계 노이즈 필터</text>
  <rect x="520" y="246" width="140" height="40" rx="6" fill="#FFFDE7" stroke="#FDE68A" filter="url(#shadow)"/>
  <text x="590" y="264" text-anchor="middle" class="bt">GestureSession</text>
  <text x="590" y="278" text-anchor="middle" class="bs">연속 pinch 진행도</text>
  <rect x="674" y="246" width="140" height="40" rx="6" fill="#FFFDE7" stroke="#FDE68A" filter="url(#shadow)"/>
  <text x="744" y="264" text-anchor="middle" class="bt">DragModel</text>
  <text x="744" y="278" text-anchor="middle" class="bs">드래그 (분리 최적화)</text>

  <!-- input layer → AppState -->
  <line x1="590" y1="292" x2="590" y2="328" stroke="#6b7280" stroke-width="2" marker-end="url(#aG)"/>
  <text x="598" y="314" class="lblG">의도 쓰기</text>

  <!-- ============ LaunchCore (LEFT) ============ -->
  <rect x="60" y="330" width="300" height="140" rx="10" fill="#FFFDE7" stroke="#E6C200"/>
  <rect x="60" y="330" width="300" height="36" rx="10" fill="#FCD34D"/>
  <rect x="60" y="354" width="300" height="12" fill="#FCD34D"/>
  <text x="210" y="353" text-anchor="middle" class="head">② LaunchCore — 순수 규칙</text>
  <text x="78" y="385" class="li">· Foundation only (GUI 없음)</text>
  <text x="78" y="403" class="li">· AppCatalog · LayoutOrder · FolderLayout</text>
  <text x="78" y="421" class="li">· TrackpadIntent · ContactGate</text>
  <text x="78" y="445" class="li">→ LaunchpadCheck가 오프라인 검증</text>

  <!-- LaunchCore ↔ AppState -->
  <line x1="360" y1="400" x2="438" y2="400" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 3" marker-start="url(#aY)" marker-end="url(#aY)"/>
  <text x="399" y="393" text-anchor="middle" class="lblY">순수 규칙 질의</text>

  <!-- ============ AppState HUB (CENTER) ============ -->
  <rect x="440" y="330" width="300" height="140" rx="10" fill="#FFFFFF" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="330" width="300" height="36" rx="10" fill="#2563eb"/>
  <rect x="440" y="354" width="300" height="12" fill="#2563eb"/>
  <text x="590" y="353" text-anchor="middle" class="headW">③ AppState · 단일 진실의 원천</text>
  <text x="590" y="382" text-anchor="middle" class="hubT">Observable 모델 (hub)</text>
  <text x="458" y="404" class="li">· AppCatalog · LayoutOrder · FolderLayout</text>
  <text x="458" y="422" class="li">· Query · Selection · Phase</text>
  <text x="458" y="446" class="li">모든 흐름이 이 상태를 읽고 쓴다</text>

  <!-- AppState ↔ Persistence -->
  <line x1="740" y1="400" x2="818" y2="400" stroke="#2563eb" stroke-width="1.6" marker-start="url(#aB)" marker-end="url(#aB)"/>
  <text x="779" y="393" text-anchor="middle" class="lblB">load / save</text>

  <!-- ============ Persistence (RIGHT) ============ -->
  <rect x="820" y="330" width="300" height="140" rx="10" fill="#F4F4F4" stroke="#E0E0E0"/>
  <rect x="820" y="330" width="300" height="36" rx="10" fill="#FFD54F"/>
  <rect x="820" y="354" width="300" height="12" fill="#FFD54F"/>
  <text x="970" y="353" text-anchor="middle" class="head">영속 · 캐시</text>
  <text x="838" y="385" class="li">· Icon 다운샘플 캐시</text>
  <text x="838" y="403" class="li">· Settings (그리드/외관/소스)</text>
  <text x="838" y="421" class="li">· Launchpad 레이아웃 가져오기</text>
  <text x="838" y="445" class="li">→ Sparkle Appcast 자동 업데이트</text>

  <!-- ============ BOTTOM: View (observe) & Actions (dispatch) ============ -->
  <!-- AppState → View -->
  <line x1="520" y1="470" x2="520" y2="538" stroke="#6b7280" stroke-width="2" marker-end="url(#aG)"/>
  <text x="528" y="508" class="lblG">observe</text>
  <!-- AppState → Actions -->
  <line x1="660" y1="470" x2="660" y2="538" stroke="#6b7280" stroke-width="2" marker-end="url(#aG)"/>
  <text x="668" y="508" class="lblG">dispatch</text>

  <!-- SwiftUI View -->
  <rect x="300" y="540" width="280" height="84" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <rect x="300" y="540" width="280" height="30" rx="10" fill="#93C5FD"/>
  <rect x="300" y="560" width="280" height="10" fill="#93C5FD"/>
  <text x="440" y="560" text-anchor="middle" class="head">④ 렌더 · SwiftUI</text>
  <text x="440" y="588" text-anchor="middle" class="bt">LauncherView</text>
  <text x="440" y="606" text-anchor="middle" class="bs">그리드·폴더·검색·페이지 (DragModel만 재빌드)</text>

  <!-- LauncherActions -->
  <rect x="600" y="540" width="280" height="84" rx="10" fill="#F4F4F4" stroke="#E0E0E0"/>
  <rect x="600" y="540" width="280" height="30" rx="10" fill="#FFD54F"/>
  <rect x="600" y="560" width="280" height="10" fill="#FFD54F"/>
  <text x="740" y="560" text-anchor="middle" class="head">⑤ 부작용 · LaunchApp</text>
  <text x="740" y="588" text-anchor="middle" class="bt">LauncherActions → Lifecycle</text>
  <text x="740" y="606" text-anchor="middle" class="bs">→ AppDelegate · AppSystemAdapter</text>

  <!-- View / Actions → macOS substrate -->
  <line x1="440" y1="624" x2="440" y2="654" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aG)"/>
  <line x1="740" y1="624" x2="740" y2="654" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aG)"/>

  <!-- ============ macOS substrate (bottom) ============ -->
  <rect x="60" y="656" width="1060" height="52" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <text x="80" y="678" class="band">macOS — 시스템 경계</text>
  <text x="590" y="690" text-anchor="middle" class="li">MultitouchSupport (private)  ·  AppKit / SwiftUI  ·  Accessibility · Carbon  ·  File System (/Applications)  ·  Finder · Dock · Spotlight</text>

  <!-- Legend (compact, top-left) -->
  <g transform="translate(60,76)">
    <text x="0" y="0" class="band">범례</text>
    <line x1="0" y1="14" x2="30" y2="14" stroke="#6b7280" stroke-width="2" marker-end="url(#aG)"/>
    <text x="36" y="18" class="srcs">제어 흐름</text>
    <line x1="0" y1="32" x2="30" y2="32" stroke="#2563eb" stroke-width="1.6" marker-end="url(#aB)"/>
    <text x="36" y="36" class="srcs">데이터 load/save</text>
    <line x1="0" y1="50" x2="30" y2="50" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#aY)"/>
    <text x="36" y="54" class="srcs">순수 규칙 참조</text>
  </g>
</svg>
